<style>
/* ワード表ページ専用の追加スタイル。既存 style.css は変更しません。 */
.word-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:28px 0 18px}
.word-search{width:min(100%,440px);padding:13px 17px;border:1px solid var(--border);border-radius:14px;background:white;color:var(--text);font:inherit}
.word-search:focus{outline:3px solid #e9d4fb;border-color:var(--purple)}
.word-count{font-size:.86rem;color:var(--muted);font-weight:700}
.category-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 34px}
.category-nav a{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--purple-dark);text-decoration:none;font-size:.82rem;font-weight:700}
.category-nav a:hover,.category-nav a:focus-visible{background:var(--lavender)}
.word-sections{display:grid;gap:22px;padding-bottom:65px}
.word-section{scroll-margin-top:20px}
.word-section .step-heading{margin-bottom:18px}
.word-section .step-number{width:52px;height:52px;font-size:1.15rem}
.word-section .section-count{color:var(--muted);font-size:.8rem;margin:3px 0 0}
.word-group+.word-group{margin-top:22px}
.word-group h3{font-size:.98rem;color:var(--purple-dark);margin:0 0 10px}
.word-grid{display:flex;flex-wrap:wrap;gap:9px}
.word-chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;padding:7px 13px;border:1px solid var(--border);border-radius:12px;background:#fcf9ff;line-height:1.5}
.word-chip strong{font-size:.92rem;font-weight:700;overflow-wrap:anywhere}
.word-chip small{font-size:.7rem;color:var(--muted)}
.word-chip[hidden],.word-group[hidden],.word-section[hidden]{display:none}
.no-results{text-align:center;color:var(--muted);padding:32px 12px}
@media(max-width:700px){.word-section.step{padding:20px 16px}.word-grid{gap:7px}.word-chip{padding:6px 10px}.word-chip strong{font-size:.86rem}}
</style>
</head>

<script>
(()=>{
const categories=JSON.parse(document.getElementById('wordData').textContent);
const sections=document.getElementById('wordSections');
const nav=document.getElementById('categoryNav');
const count=document.getElementById('count');
const search=document.getElementById('search');
const noResults=document.getElementById('noResults');
const total=categories.reduce((n,c)=>n+c.groups.reduce((a,g)=>a+g.words.length,0),0);
const nodes=[];
for(const c of categories){
 const id='category-'+c.number;
 const link=document.createElement('a');link.href='#'+id;link.textContent=c.number+'. '+c.title;nav.append(link);
 const section=document.createElement('section');section.className='step word-section';section.id=id;
 const heading=document.createElement('div');heading.className='step-heading';
 const number=document.createElement('span');number.className='step-number';number.textContent=c.number;
 const info=document.createElement('div');const title=document.createElement('h2');title.textContent=c.title;
 const sub=document.createElement('p');sub.className='section-count';sub.textContent=c.declared+'ワード';info.append(title,sub);heading.append(number,info);section.append(heading);
 const entries=[];
 for(const g of c.groups){
  const group=document.createElement('div');group.className='word-group';
  if(g.name){const h=document.createElement('h3');h.textContent=g.name;group.append(h)}
  const grid=document.createElement('div');grid.className='word-grid';
  for(const w of g.words){const chip=document.createElement('span');chip.className='word-chip';const strong=document.createElement('strong');strong.textContent=w.word;chip.append(strong);if(w.reading){const small=document.createElement('small');small.textContent=w.reading;chip.append(small)}grid.append(chip);entries.push({node:chip,text:(w.word+' '+w.reading).normalize('NFKC').toLowerCase(),group})}
  group.append(grid);section.append(group);
 }
 sections.append(section);nodes.push({section,entries,sub});
}
function update(){const q=search.value.trim().normalize('NFKC').toLowerCase();let visible=0;
 for(const item of nodes){let sectionVisible=0;const groups=new Map();for(const entry of item.entries){const match=!q||entry.text.includes(q);entry.node.hidden=!match;if(match){visible++;sectionVisible++;groups.set(entry.group,true)}else if(!groups.has(entry.group))groups.set(entry.group,false)}for(const [group] of groups){group.hidden=!item.entries.some(e=>e.group===group&&!e.node.hidden)}item.section.hidden=!sectionVisible;item.sub.textContent=q?sectionVisible+'件 / '+item.entries.length+'ワード':item.entries.length+'ワード'}
 count.textContent=q?visible+'件見つかりました':'全'+total+'ワード';noResults.hidden=visible!==0;
}
search.addEventListener('input',update);update();
})();
</script>
